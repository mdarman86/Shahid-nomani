<header class="header smart-header" id="smartHeader">

    <div class="container">

        <nav class="navbar" aria-label="Main navigation">

            <!-- =================================================
                 LOGO
            ================================================== -->

            <a
                href="{{ url_for('public.home') }}"
                class="logo"
                aria-label="Shahid Nomani Al-Misbahi Home"
            >

                <img
                    src="{{ url_for(
                        'static',
                        filename='images/branding/logo.jpg'
                    ) }}"
                    alt="Shahid Nomani Al-Misbahi Logo"
                >

                <div class="logo-text">

                    <h2>
                        Shahid Nomani
                    </h2>

                    <span>
                        AL-MISBAHI
                    </span>

                </div>

            </a>


            <!-- =================================================
                 DESKTOP / MOBILE NAVIGATION
            ================================================== -->

            <ul
                class="nav-links"
                id="navLinks"
            >

                <!-- HOME -->

                <li>

                    <a
                        href="{{ url_for('public.home') }}#home"
                        class="{% if request.endpoint == 'public.home' %}active{% endif %}"
                        data-i18n="nav.home"
                    >

                        <i
                            class="fa-solid fa-house"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Home
                        </span>

                    </a>

                </li>


                <!-- ARTICLES -->

                <li>

                    <a
                        href="{{ url_for('public.articles') }}"
                        class="{% if request.endpoint == 'public.articles' %}active{% endif %}"
                        data-i18n="nav.articles"
                    >

                        <i
                            class="fa-solid fa-newspaper"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Articles
                        </span>

                    </a>

                </li>


                <!-- BAYANS -->

                <li>

                    <a
                        href="{{ url_for('public.bayans') }}"
                        class="{% if request.endpoint in [
                            'public.bayans',
                            'public.bayan_detail',
                            'public.bayan_watch'
                        ] %}active{% endif %}"
                        data-i18n="nav.bayan"
                    >

                        <i
                            class="fa-solid fa-microphone"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Bayan
                        </span>

                    </a>

                </li>


                <!-- BOOKS -->

                <li>

                    <a
                        href="{{ url_for('public.books') }}"
                        class="{% if request.endpoint in [
                            'public.books',
                            'public.online_books',
                            'public.books_buy',
                            'public.book_detail',
                            'public.book_reader',
                            'public.book_order'
                        ] %}active{% endif %}"
                        data-i18n="nav.books"
                    >

                        <i
                            class="fa-solid fa-book"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Books
                        </span>

                    </a>

                </li>


                <!-- URDU ADAB -->

                <li>

                    <a
                        href="{{ url_for('public.adab') }}"
                        class="{% if request.endpoint in [
                            'public.adab',
                            'public.adab_detail'
                        ] %}active{% endif %}"
                        data-i18n="nav.adab"
                    >

                        <i
                            class="fa-solid fa-pen-nib"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Urdu Adab
                        </span>

                    </a>

                </li>


                <!-- ABOUT -->

                <li>

                    <a
                        href="{{ url_for('public.about') }}"
                        class="{% if request.endpoint == 'public.about' %}active{% endif %}"
                        data-i18n="nav.about"
                    >

                        <i
                            class="fa-solid fa-user"
                            aria-hidden="true"
                        ></i>

                        <span>
                            About
                        </span>

                    </a>

                </li>


                <!-- GALLERY -->

                <li>

                    <a
                        href="{{ url_for('public.gallery') }}"
                        class="{% if request.endpoint == 'public.gallery' %}active{% endif %}"
                        data-i18n="nav.gallery"
                    >

                        <i
                            class="fa-solid fa-images"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Gallery
                        </span>

                    </a>

                </li>


                <!-- CONTACT -->

                <li>

                    <a
                        href="{{ url_for('public.contact') }}"
                        class="{% if request.endpoint == 'public.contact' %}active{% endif %}"
                        data-i18n="nav.contact"
                    >

                        <i
                            class="fa-solid fa-envelope"
                            aria-hidden="true"
                        ></i>

                        <span>
                            Contact
                        </span>

                    </a>

                </li>

            </ul>


            <!-- =================================================
                 RIGHT ACTIONS
            ================================================== -->

            <div class="nav-actions">

                <!-- LANGUAGE -->

                <div class="language-selector">

                    <i
                        class="fa-solid fa-language"
                        aria-hidden="true"
                    ></i>

                    <select
                        id="languageSelector"
                        aria-label="Select Language"
                    >

                        <option value="en">
                            English
                        </option>

                        <option value="ur">
                            اردو
                        </option>

                        <option value="hi">
                            हिन्दी
                        </option>

                    </select>

                </div>


                <!-- MOBILE MENU BUTTON -->

                <button
                    class="menu-btn"
                    id="menuBtn"
                    type="button"
                    aria-label="Open navigation menu"
                    aria-expanded="false"
                    aria-controls="navLinks"
                >

                    <i
                        class="fa-solid fa-bars"
                        aria-hidden="true"
                    ></i>

                </button>

            </div>

        </nav>

    </div>

</header>
