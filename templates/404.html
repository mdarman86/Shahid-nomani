{% extends 'base.html' %}

{% block title %}
Page Not Found
{% endblock %}

{% block content %}

<section class="page-hero error-page">
    <div class="container">

        <span class="eyebrow">404</span>

        <h1>
            Page not found
        </h1>

        <p>
            The page you are looking for does not exist.
        </p>

        <a
            class="btn btn-green"
            href="{{ url_for('public.home') }}"
        >
            Back Home
        </a>

    </div>
</section>

{% endblock %}
