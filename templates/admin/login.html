<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        Admin Login | Shahid Nomani
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-brand">

                <img
                    src="{{ url_for('static', filename='images/branding/footer_logo.jpg') }}"
                    alt="Shahid Nomani"
                >

            </div>


            <span class="login-eyebrow">
                OFFICIAL WEBSITE
            </span>


            <h1>
                Admin Login
            </h1>


            <p>
                Manage website content securely.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    <div class="login-flashes">

                        {% for category, message in messages %}

                            <div class="flash {{ category }}">

                                {{ message }}

                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <form
                method="post"
                class="login-form"
            >

                {% include "_csrf.html" %}


                <label>

                    Username

                    <div class="input-wrap">

                        <i class="fa-regular fa-user"></i>

                        <input
                            type="text"
                            name="username"
                            autocomplete="username"
                            required
                            autofocus
                        >

                    </div>

                </label>


                <label>

                    Password

                    <div class="input-wrap">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </label>


                <button
                    class="admin-btn login-btn"
                    type="submit"
                >

                    Login

                    <i class="fa-solid fa-arrow-right"></i>

                </button>

            </form>


            <a
                class="back-site"
                href="{{ url_for('public.home') }}"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Website

            </a>

        </div>

    </main>

</body>

</html>
