{% extends 'admin/base.html' %}


{% block heading %}
Add Book
{% endblock %}


{% block content %}

<form
    class="admin-form book-form upload-form"
    method="post"
    enctype="multipart/form-data"
    data-book-form
    data-upload-form
>

    {% include "_csrf.html" %}


    <!-- =========================================
         BOOK TYPE
    ========================================== -->

    <label>

        Book Type

        <select
            name="book_type"
            id="bookType"
            data-book-type
        >

            <option value="read">
                Read Online
            </option>

            <option value="order">
                Sell / Delivery
            </option>

        </select>

    </label>


    <!-- =========================================
         TITLE
    ========================================== -->

    <label>

        Title

        <input
            type="text"
            name="title"
            maxlength="150"
            required
            placeholder="Enter book title"
        >

    </label>


    <!-- =========================================
         AUTHOR
    ========================================== -->

    <label>

        Author

        <input
            type="text"
            name="author"
            value="Shahid Nomani"
            maxlength="150"
            required
            placeholder="Author name"
        >

    </label>


    <!-- =========================================
         COVER IMAGE
    ========================================== -->

    <label>

        Cover Image

        <input
            type="file"
            name="image"
            accept="image/*"
            required
            data-upload-input
        >

        <small class="field-help">
            Upload the book cover image.
        </small>

    </label>


    <!-- =========================================
         READ ONLINE ONLY
    ========================================== -->

    <div
        class="book-field"
        data-read-field
    >

        <label>

            Book PDF

            <input
                type="file"
                name="pdf"
                accept="application/pdf,.pdf"
                data-pdf-input
            >

            <small class="field-help">
                Upload the PDF for online reading.
            </small>

        </label>

    </div>


    <!-- =========================================
         SELL / DELIVERY ONLY
    ========================================== -->

    <div
        class="book-field"
        data-sell-field
        hidden
    >

        <label>

            Price (₹)

            <input
                type="number"
                name="price"
                min="0"
                max="10000000"
                step="1"
                placeholder="Enter price in INR"
                data-price-input
            >

            <small class="field-help">
                Enter the selling price in Indian Rupees.
            </small>

        </label>

    </div>


    <!-- =========================================
         UPLOAD PROGRESS
    ========================================== -->

    <div
        class="upload-progress"
        data-upload-progress
        hidden
    >

        <div class="upload-progress-head">

            <span data-upload-label>
                Uploading files
            </span>

            <strong data-upload-percent>
                0%
            </strong>

        </div>


        <div class="upload-progress-track">

            <div
                class="upload-progress-bar"
                data-upload-bar
            ></div>

        </div>


        <small data-upload-status>
            Preparing upload...
        </small>

    </div>


    <!-- =========================================
         PUBLISH
    ========================================== -->

    <label class="check">

        <input
            type="checkbox"
            name="is_published"
            checked
        >

        Publish now

    </label>


    <!-- =========================================
         SUBMIT
    ========================================== -->

    <button
        class="admin-btn"
        type="submit"
        data-submit-button
    >

        <i class="fa-solid fa-cloud-arrow-up"></i>

        Save Book

    </button>


</form>


<!-- =========================================
     SUCCESS POPUP
========================================== -->

<div
    class="upload-success-popup"
    data-upload-success-popup
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="uploadSuccessTitle"
>

    <div class="upload-success-card">

        <div class="upload-success-icon">
            <i class="fa-solid fa-check"></i>
        </div>

        <h3 id="uploadSuccessTitle">
            Book uploaded successfully
        </h3>

        <p>
            Your book has been saved successfully.
        </p>

    </div>

</div>


{% endblock %}
