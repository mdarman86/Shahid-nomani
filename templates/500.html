{% extends 'base.html' %}

{% block title %}
Server Error
{% endblock %}

{% block content %}

<section class="page-hero error-page">
    <div class="container">

        <span class="eyebrow">500</span>

        <h1>
            Something went wrong
        </h1>

        <p>
            Please try again.
        </p>

        <a
            class="btn btn-green"
            href="{{ url_for('public.home') }}"
        >
            Back Home
        </a>

    </div>
</section>

{% endblock %}
